<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaStudio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d, #1a1a1a);
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            color: white; 
            overflow: hidden;
        }
        
        .container { 
            text-align: center; 
            max-width: 600px; 
            padding: 40px; 
        }
        
        .logo { 
            width: 150px; 
            margin-bottom: 30px; 
            opacity: 0;
            animation: fadeIn 1s ease-out 0.2s forwards; 
            cursor: pointer; 
        }
        
        .logo:hover { 
            transform: scale(1.05); 
        }
        
        .brand { 
            font-size: 2.5rem; 
            font-weight: 700; 
            color: #d4af37;
            margin-bottom: 10px; 
            opacity: 0; 
            animation: fadeIn 1s ease-out 0.4s forwards; 
        }
        
        .subtitle { 
            font-size: 1.2rem; 
            color: #ccc; 
            margin-bottom: 40px;
            opacity: 0; 
            animation: fadeIn 1s ease-out 0.6s forwards; 
        }
        
        .welcome { 
            font-size: 3rem; 
            font-weight: 700; 
            margin-bottom: 30px;
            opacity: 0; 
            animation: fadeIn 1s ease-out 0.8s forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
        }
        
        .loader { 
            position: relative; 
            width: 80px; 
            height: 80px; 
            margin: 40px auto;
            opacity: 0; 
            animation: fadeIn 1s ease-out 1s forwards; 
        }
        
        .ring { 
            position: absolute; 
            border: 4px solid rgba(212,175,55,0.1);
            border-top: 4px solid #d4af37; 
            border-radius: 50%; 
            width: 80px; 
            height: 80px;
            animation: spin 1.5s linear infinite; 
        }
        
        .inner { 
            position: absolute; 
            top: 20px; 
            left: 20px;
            border: 3px solid rgba(255,255,255,0.1); 
            border-top: 3px solid white;
            border-radius: 50%; 
            width: 40px; 
            height: 40px;
            animation: spin 1s linear infinite reverse; 
        }
        
        .info { 
            font-size: 1rem; 
            color: #999; 
            margin-top: 30px;
            opacity: 0; 
            animation: fadeIn 1s ease-out 1.2s forwards; 
        }
        
        .progress { 
            width: 300px; 
            height: 4px; 
            background: rgba(255,255,255,0.1);
            border-radius: 2px; 
            margin: 30px auto; 
            overflow: hidden;
            opacity: 0; 
            animation: fadeIn 1s ease-out 1.4s forwards; 
        }
        
        .fill { 
            height: 100%; 
            background: linear-gradient(90deg, #d4af37, #f4e28c, #d4af37);
            border-radius: 2px; 
            width: 0%; 
            animation: progress 3s ease-in-out 1.5s forwards; 
        }
        
        .hint { 
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%);
            font-size: 0.9rem; 
            color: #666; 
            opacity: 0; 
            animation: fadeIn 1s ease-out 2s forwards; 
        }
        
        @keyframes fadeIn { 
            from { 
                opacity: 0; 
                transform: translateY(30px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            } 
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        @keyframes progress { 
            0% { width: 0%; } 
            30% { width: 40%; } 
            60% { width: 75%; } 
            100% { width: 100%; } 
        }
        
        @media (max-width: 768px) {
            .container { 
                padding: 20px; 
            } 
            .brand { 
                font-size: 2rem; 
            }
            .welcome { 
                font-size: 2.2rem; 
            } 
            .progress { 
                width: 250px; 
            }
            .hint { 
                bottom: 20px; 
                font-size: 0.8rem; 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo/logo2.png" alt="MetaStudio" class="logo" id="logo">
        <div class="brand">META STUDIO</div>
        <div class="subtitle">DESIGN</div>
        <div class="welcome" id="welcome">WITAMY</div>
        <div class="loader">
            <div class="ring"></div>
            <div class="inner"></div>
        </div>
        <div class="progress">
            <div class="fill"></div>
        </div>
        <div class="info" id="info">Wykrywanie języka przeglądarki...</div>
    </div>
    <div class="hint">Naciśnij ESC lub kliknij logo aby pominąć</div>

    <script>
        const lang = {
            pl: { 
                welcome: "WITAMY", 
                detecting: "Wykrywanie języka przeglądarki...", 
                loading: "Ładowanie strony polskiej...", 
                redirecting: "Przekierowanie...",
                hint: "Naciśnij ESC lub kliknij logo aby pominąć" 
            },
            de: { 
                welcome: "WILLKOMMEN", 
                detecting: "Browsersprache wird erkannt...",
                loading: "Deutsche Seite wird geladen...", 
                redirecting: "Weiterleitung...",
                hint: "Drücken Sie ESC oder klicken Sie auf das Logo zum Überspringen" 
            },
            en: { 
                welcome: "WELCOME", 
                detecting: "Detecting browser language...",
                loading: "Loading English page...", 
                redirecting: "Redirecting...",
                hint: "Press ESC or click logo to skip" 
            }
        };
        
        let detected = 'pl';
        let timer;
        
        function detect() {
            const browser = navigator.language.toLowerCase();
            
            if (browser.startsWith('de')) {
                detected = 'de';
            } else if (browser.startsWith('en')) {
                detected = 'en';
            } else {
                detected = 'pl';
            }
            
            const t = lang[detected];
            document.getElementById('welcome').textContent = t.welcome;
            document.getElementById('info').textContent = t.detecting;
            document.querySelector('.hint').textContent = t.hint;
            document.documentElement.lang = detected;
            
            timer = setTimeout(() => {
                document.getElementById('info').textContent = t.loading;
                setTimeout(() => {
                    document.getElementById('info').textContent = t.redirecting;
                    setTimeout(redirect, 800);
                }, 1500);
            }, 2500);
        }
        
        function redirect() {
            const url = detected === 'de' ? 'index-de.html' : 'index-pl.html';
            window.location.href = url;
        }
        
        function skip() {
            if (timer) {
                clearTimeout(timer);
            }
            window.location.href = 'index-pl.html';
        }
        
        document.addEventListener('DOMContentLoaded', () => setTimeout(detect, 1000));
        document.addEventListener('keydown', e => e.key === 'Escape' && skip());
        document.getElementById('logo').addEventListener('click', skip);
        setTimeout(() => {
            document.body.addEventListener('click', e => {
                if (e.target.id !== 'logo') {
                    skip();
                }
            });
        }, 3000);
    </script>
</body>
</html>
