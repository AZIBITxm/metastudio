<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal</title>
    <link rel="stylesheet" href="modale/gallery-modal.css">
</head>
<body>
    <!-- Test buttons -->
    <button onclick="testGallery()">Test Gallery 1</button>
    <button onclick="testFullscreen()">Test Fullscreen Direct</button>
    <button onclick="checkMainImage()">Check Main Image</button>
    
    <!-- Modal HTML -->
    <div id="gallery-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Test Gallery</h2>
                <span class="close-btn">&times;</span>
            </div>
            <div class="modal-body">
                <div class="gallery-container">
                    <img class="gallery-main-image" alt="Main image">
                    <video class="gallery-main-video" controls style="display:none;"></video>
                    <button class="gallery-nav prev">‹</button>
                    <button class="gallery-nav next">›</button>
                </div>
                <div class="gallery-thumbnails"></div>
                <div class="gallery-counter">
                    <span class="current-image">1</span> / <span class="total-images">1</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Fullscreen -->
    <div id="gallery-fullscreen" class="fullscreen-container" style="display:none;">
        <img class="fullscreen-image" alt="Fullscreen image">
        <video class="fullscreen-video" controls style="display:none;"></video>
        <div class="fullscreen-close">&times;</div>
    </div>
    
    <script src="modale/gallery-modal.js"></script>
    <script>
        // Initialize gallery modal
        const galleryModal = new GalleryModal();
        
        function testGallery() {
            console.log('Opening test gallery');
            galleryModal.openModal('1');
        }
        
        function testFullscreen() {
            console.log('Testing fullscreen directly');
            if (galleryModal.images && galleryModal.images.length > 0) {
                galleryModal.openFullscreen();
            } else {
                console.log('No images loaded yet, opening gallery first');
                galleryModal.openModal('1').then(() => {
                    setTimeout(() => {
                        console.log('Now testing fullscreen');
                        galleryModal.openFullscreen();
                    }, 1000);
                });
            }
        }
        
        function checkMainImage() {
            console.log('Checking main image...');
            const mainImage = document.querySelector('.gallery-main-image');
            console.log('Main image element:', mainImage);
            if (mainImage) {
                console.log('Main image src:', mainImage.src);
                console.log('Main image display:', getComputedStyle(mainImage).display);
                console.log('Main image visibility:', getComputedStyle(mainImage).visibility);
                console.log('Main image opacity:', getComputedStyle(mainImage).opacity);
                
                // Dodaj tymczasowy event listener do testu
                mainImage.addEventListener('click', function testClick() {
                    console.log('TEST: Main image clicked!');
                    mainImage.removeEventListener('click', testClick);
                });
                console.log('Added temporary click listener to main image');
            } else {
                console.log('Main image not found');
            }
        }
    </script>
</body>
</html>
